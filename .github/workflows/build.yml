name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Version comes from the tag (v2.0.1) or, on main, from <Version> in src/Glance/Glance.csproj
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v=$(grep -oP '(?<=<Version>)[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' src/Glance/Glance.csproj | head -1); fi
          echo "v=${v:-2.0.0}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test src/Glance.Tests/Glance.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish ${{ matrix.rid }} (self-contained single file = installer + app)
        run: >
          dotnet publish src/Glance/Glance.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.v }} -p:GlanceUpdateRepo=${{ github.repository_owner }}/Glance-Releases+${{ github.repository }} -o out
      - name: Package
        shell: pwsh
        run: |
          $extra = Get-ChildItem out -File | Where-Object { $_.Name -ne 'Glance.exe' }
          if ($extra) { Write-Host "::warning::Extra files next to Glance.exe: $($extra.Name -join ', ')" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/Glance.exe "dist/Glance-${{ matrix.rid }}.exe"
      # Real Windows VM check: launches Glance, tours the UI in dark and light mode, saves screenshots.
      - name: Self-test on Windows (screenshots)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $key -Force | Out-Null
          $fail = $false
          foreach ($mode in @('dark', 'light')) {
            $v = if ($mode -eq 'light') { 1 } else { 0 }
            Set-ItemProperty $key AppsUseLightTheme $v -Type DWord
            Set-ItemProperty $key SystemUsesLightTheme $v -Type DWord
            Remove-Item "$env:LOCALAPPDATA\Glance" -Recurse -Force -ErrorAction SilentlyContinue
            $dir = "$pwd\selftest\$mode"
            $p = Start-Process out\Glance.exe -ArgumentList '--portable', '--selftest', "`"$dir`"" -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "::error::Self-test ($mode) hung"; $fail = $true; continue }
            Get-Content "$dir\report.txt" -ErrorAction SilentlyContinue | Write-Host
            if ($p.ExitCode -ne 0) { Write-Host "::error::Self-test ($mode) failed: exit $($p.ExitCode)"; $fail = $true }
          }
          if ($fail) { exit 1 }
      # Screenshots also go to the «selftest» branch (always the latest run), readable with plain git.
      - name: Publish self-test screenshots
        if: always() && matrix.rid == 'win-x64' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path selftest)) { exit 0 }
          Set-Location selftest
          git init -q -b selftest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test ${{ needs.version.outputs.v }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest
      - uses: actions/upload-artifact@v4
        if: always() && matrix.rid == 'win-x64'
        with:
          name: selftest
          path: selftest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-${{ matrix.rid }}
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish ${{ matrix.rid }} (self-contained single file = installer + app)
        run: >
          dotnet publish src/Glance.Linux/Glance.Linux.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.v }} -p:GlanceUpdateRepo=${{ github.repository_owner }}/Glance-Releases+${{ github.repository }} -o out
      - name: Package
        run: |
          mkdir dist
          cp out/Glance "dist/Glance-${{ matrix.rid }}"
          chmod +x "dist/Glance-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-${{ matrix.rid }}
          path: dist/*

  release:
    needs: [version, test, windows, linux]
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Glance-*
          merge-multiple: true
      - name: Delta-update block maps
        working-directory: artifacts
        run: |
          python3 ../repo/build/makeblocks.py Glance-*
          # compressed copies for full downloads (the program itself is stored uncompressed for small deltas)
          for f in Glance-*; do case "$f" in *.blocks) ;; *) gzip -9 -k -n "$f" ;; esac; done
          ls -la
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum Glance-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-all
          path: artifacts/*
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## ${{ needs.version.outputs.v }}" '$0==v{f=1;next} /^## /{if(f)exit} f' repo/CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Автор: [ddedlish](https://steamcommunity.com/id/ddedlish/)" >> notes.md
          cat notes.md
      # Every push to main publishes/refreshes release v<Version> (bump <Version> in Glance.csproj for a new release).
      - name: GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: Glance ${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: artifacts/*
      # Public download/update channel: ddedlish/Glance-Releases (the code repository can then be private).
      # Needs a token with write access to that repo in the RELEASES_TOKEN secret; skipped until it exists.
      - name: Public release (Glance-Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/Glance-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ needs.version.outputs.v }}
          name: Glance ${{ needs.version.outputs.v }}
          body_path: notes.md
          make_latest: true
          files: artifacts/*
